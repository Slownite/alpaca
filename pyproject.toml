[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-cli"
version = "0.2.0"
description = "Ollama-style wrapper for vLLM with Ray distributed inference"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Samuel Diop"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "huggingface_hub",
    "httpx",
    "argcomplete",
    "psutil",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Real GPU backend. Kept out of the default closure so the CLI and its
# MockEngine-backed tests resolve and build without CUDA.
gpu = [
    "vllm>=0.6",
    "ray[default]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/Slownite/alpaca"
Repository = "https://github.com/Slownite/alpaca.git"
Issues = "https://github.com/Slownite/alpaca/issues"

[project.scripts]
alpaca = "alpaca.cli:main"

[tool.setuptools.packages.find]
include = ["alpaca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Resolve torch/vllm from prebuilt wheels instead of building from sdist,
# which would otherwise require CUDA_HOME at lock time.
no-build-package = ["vllm", "torch"]
